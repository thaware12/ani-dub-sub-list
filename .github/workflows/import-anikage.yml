name: Import AniKage Snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import AniKage data
        run: python scripts/import_anikage.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/progress.json data/snapshot-meta.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "data: import AniKage snapshot"
          git push
